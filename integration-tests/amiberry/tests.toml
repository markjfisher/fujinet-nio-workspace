# Add a [[test]] entry and a Startup-Sequence under startup/ to add coverage.

[[test]]
name = "wifi-config"
project = "apps"
app = "wificonfigtest"
startup = "startup/wifi-config.sequence"
results = ["wificonfigtest.result"]

[[test]]
name = "cli-stateful"
project = "apps"
app = "wifitest"
startup = "startup/cli-stateful.sequence"
results = [
  "cli-fhost-set.result",
  "cli-fhost-get.result",
  "cli-fls.result",
  "cli-fapp-put.result",
  "cli-fapp-get.result",
  "cli-fapp-list.result",
  "cli-fapp-delete.result",
]

[[test]]
name = "diskdevice-adf"
project = "apps"
app = "wifitest"
driver = true
timeout = 75
activity_timeout = 60
screenshot_quiet = 10
startup = "startup/diskdevice-adf.sequence"
results = [
  "disk-load.result",
  "disk-mount.result",
  "disk-mount-rc.result",
  "disk-dos-mount.result",
  "disk-read-a.result",
  "disk-read-b.result",
  "disk-dir.result",
  "disk-dir-rc.result",
  "disk-type.result",
  "disk-mount-1.result",
  "disk-dos-mount-1.result",
  "disk-type-1.result",
]
