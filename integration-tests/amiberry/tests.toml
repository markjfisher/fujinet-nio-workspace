# Add a [[test]] entry and a Startup-Sequence under startup/ to add coverage.

[[test]]
name = "wifi-config"
project = "apps"
app = "wificonfigtest"
startup = "startup/wifi-config.sequence"
results = ["wificonfigtest.result"]

[[test]]
name = "cli-stateful"
project = "apps"
app = "wifitest"
startup = "startup/cli-stateful.sequence"
results = [
  "cli-fhost-set.result",
  "cli-fhost-get.result",
  "cli-fls.result",
  "cli-fapp-put.result",
  "cli-fapp-get.result",
  "cli-fapp-list.result",
  "cli-fapp-delete.result",
]

[[test]]
name = "diskdevice-adf"
project = "apps"
app = "wifitest"
driver = true
timeout = 75
activity_timeout = 60
screenshot_quiet = 10
completion_log = "E2E COMPLETE"
screenshot_delay = 0.2
startup = "startup/diskdevice-adf.sequence"
results = [
  "disk-load.result",
  "disk-exec-boundary.result",
  "disk-mount.result",
  "disk-mount-rc.result",
  "disk-dos-mount.result",
  "disk-read-a.result",
  "disk-read-b.result",
  "disk-dir.result",
  "disk-dir-rc.result",
  "disk-type.result",
  "disk-mount-1.result",
  "disk-dos-mount-1.result",
  "disk-type-1.result",
  "disk-status-1-early.result",
  "disk-mount-rw.result",
  "disk-update.result",
  "disk-eject.result",
  "disk-remount-rw.result",
  "disk-dos-remount-2.result",
  "disk-persist.result",
  "disk-status-0.result",
  "disk-status-1.result",
  "disk-status-2.result",
  "disk-status-3.result",
  "disk-malformed.result",
  "disk-mount-direct.result",
  "disk-mount-direct-rc.result",
  "disk-failed-replacement.result",
  "disk-status-7.result",
]

[[test]]
name = "diskdevice-mapping-failure"
project = "apps"
app = "wifitest"
driver = true
mapping_readonly = true
timeout = 45
activity_timeout = 35
screenshot_quiet = 2
completion_log = "E2E COMPLETE"
startup = "startup/diskdevice-mapping-failure.sequence"
results = [
  "map-load.result",
  "map-direct.result",
  "map-failure.result",
  "map-status.result",
]

[[test]]
name = "diskdevice-silent-timeout"
project = "apps"
app = "wifitest"
driver = true
silent_peer = true
timeout = 75
activity_timeout = 60
screenshot_quiet = 0.2
startup = "startup/diskdevice-silent-timeout.sequence"
results = ["silent-timeout.result"]
