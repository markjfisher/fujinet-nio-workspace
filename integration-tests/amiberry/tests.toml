[[test]]
name = "diskdevice-stalled-external-peer"
project = "apps"
app = "wifitest"
driver = true
silent_peer = true
# This case does not launch a local fujinet-nio instance. It connects Amiberry
# to a fake external TCP peer that accepts the connection, emits a single SLIP
# delimiter, then stalls. The mount command must fail in bounded time and must
# not leave behind a successful mount result artifact.
timeout = 40
activity_timeout = 25
screenshot_quiet = 2
screenshot_interval = 0.5
startup = "startup/diskdevice-silent-timeout.sequence"
completion_mode = "expected_timeout"
results = ["fmount.result", "stalled-peer-timeout.result"]

